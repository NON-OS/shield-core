# Every claim in this repository is true today. This is what keeps it true.
#
# The crates the wallet builds against are vendored as pinned source in
# vendor/, so the runner builds exactly the code the tests ran against.
name: check

on:
  push:
  pull_request:
  # Every core commit carries [skip ci], so a run is asked for by hand.
  workflow_dispatch:

# Warnings are denied in our crates only, by clippy. A vendored crate keeps upstream's code, warnings
# and all, and is never edited here.
env:
  CARGO_TERM_COLOR: never
  # No debug info in CI builds. Every test binary links the whole core with the
  # embedded Tor client, and with debug info two dozen of them fill the runner's
  # disk until the linker dies of it. Tests assert; they are not stepped through.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The runner ships toolchains this job never touches; their space is
      # what the linker needs.
      - name: Room to link
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /


      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy

      # Our crates only. The vendored ones keep upstream's formatting, and a
      # change made in the copy is one the next update silently discards.
      - name: Format
        run: cargo fmt -p nox_shield_core -p nox_verified --check

      - name: Lints
        run: cargo clippy -p nox_shield_core -p nox_verified --all-targets --all-features -- -D warnings

      # All features, because the parser sweep sits behind the one that exposes
      # the parsers to a fuzzer. Without it that sweep is a file nothing runs.
      # The vendored crates are tested where they come from.
      - name: Tests
        run: cargo test -p nox_shield_core -p nox_verified --all-features

  # The model checker, over every harness that finishes. The reply reader harness, which feeds
  # every string up to 8 bytes, does not finish and is left out. The `account` fuzz target covers
  # that reader instead.
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Room to build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Kani 0.68.0
        run: cargo install --locked kani-verifier --version 0.68.0 && cargo kani setup

      - name: Every harness that finishes is verified
        run: |
          cargo kani -p nox_shield_core --lib \
            --harness a_gas_limit_is_exact_for_ether_and_never_below_the_estimate \
            --harness an_offer_is_always_one_the_chain_accepts_and_never_overpays \
            --harness any_revert_data_reads_as_a_sentence_without_panicking \
            --harness what_arrives_and_the_fee_add_up_to_what_was_sent \
            --harness every_header_announces_its_own_length \
            --harness every_integer_is_minimal_and_decodes_back \
            --harness a_send_that_passes_the_balance_check_is_always_covered

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.91.1"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Licences, bans, sources, advisories
        run: cargo deny check
      - name: Advisories again, from the other database
        run: cargo audit

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: lean
          build: true
          test: false

  # The TLA+ models of the wallet's concurrency: nonces and reviews on the
  # public account, notes across two devices, and the hole take-back closes.
  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Every model holds, and the frozen one still fails
        run: spec/check.sh

  # The four 37-limb vectors of the deployed circuit, proved again by this build and compared byte
  # for byte, from the public STARKs repository at a pinned commit. Then a damaged periodic cache,
  # which a proof must survive by building a fresh one.
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NON-OS/STARKs
          ref: a47d23ae969e23b5f841e30b49a1d483a80a6b02
          path: starks
          sparse-checkout: spec/wallet-vectors-not-before

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.91.1"

      - name: The four vectors, byte for byte, and a damaged cache rebuilt
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          PROD_VECTORS: ${{ github.workspace }}/starks/spec/wallet-vectors-not-before
          PROD_VECTORS_OUT: ${{ runner.temp }}
        run: |
          cargo test --release -p nox_shield_core --test prod_vectors -- --ignored --nocapture
          cargo test --release -p nox_shield_core --test stale_cache -- --ignored --nocapture

  # The Android app built against this commit of the core, so a core change that breaks the app
  # fails here. Unpinned on purpose: the app's own core.lock names a published commit. The debug
  # and the unsigned release packages are the run's artifact. Nothing here is signed for release.
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Room to link
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: shield-core

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NON-OS/shield-android
          path: android

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-ndk@4.1.2

      - name: The core for both ABIs, then the app, its lints and its tests
        working-directory: android
        env:
          NOX_SHIELD_CORE: ${{ github.workspace }}/shield-core
          NOX_CORE_UNPINNED: "1"
        run: |
          scripts/build-core.sh
          ./gradlew --no-daemon ktlintCheck detekt :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          scripts/align-release.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/nonos-unsigned-aligned.apk
          scripts/check-manifest.sh
          scripts/check-package.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/nonos-unsigned-aligned.apk
