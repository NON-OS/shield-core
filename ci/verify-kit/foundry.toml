[profile.default]
src = "contracts"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
gas_limit = 90000000000
memory_limit = 536870912
fs_permissions = [{ access = "read", path = "./" }]
remappings = ["forge-std/=lib/forge-std/src/"]
